[package]
name = "gitinspect-model"
version = "0.3.0-rc.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
gix-object = { version = "0.66", default-features = false }
gix-hash = { version = "0.28", default-features = false, features = ["sha1"] }

[lints.rust]
unsafe_code = "forbid"
