[package]
name = "gitinspect-wasm"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.127"
gitinspect-model = { path = "../gitinspect-model" }

[lints.rust]
unsafe_code = "forbid"

# Skip the very large incremental compilation cache in dev builds.
[profile.dev]
incremental = false
