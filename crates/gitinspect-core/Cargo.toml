[package]
name = "gitinspect-core"
version = "0.3.0-rc.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gitinspect-model = { path = "../gitinspect-model" }
gix = { version = "0.86.0", features = ["blob-diff", "revision"] }
notify = "8.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "3.2"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
# Keep debug and test builds from accumulating large incremental compiler caches.
[profile.dev]
incremental = false

[profile.test]
incremental = false
