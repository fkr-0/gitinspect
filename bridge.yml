version: 1
name: gitinspect
description: GPU-driven 3D Git repository visualization and mutation studio
commands:
  install:
    run: [pnpm, install]
    category: custom
    timeoutMs: 120000
  typecheck:
    run: [pnpm, typecheck]
    category: build
    timeoutMs: 120000
  test:
    run: [pnpm, test]
    category: test
    timeoutMs: 120000
  build:
    run: [pnpm, build]
    category: build
    timeoutMs: 180000
  check:
    run: [pnpm, check]
    category: test
    timeoutMs: 300000
  release-verify:
    run: [pnpm, release:verify]
    category: test
    timeoutMs: 600000
  release-package-audit-test:
    run: [pnpm, release:package-audit-test]
    category: test
    timeoutMs: 120000
  release-package-qualify:
    run: [pnpm, release:package-qualify]
    category: test
    timeoutMs: 1200000
  release-native-qualify:
    run: [pnpm, release:native-qualify]
    category: test
    timeoutMs: 600000
agent:
  notes: >-
    Preserve unrelated changes, never write to bare /tmp, coordinate concurrent writes with
    ws-bridge path claims, and keep mutations preview-first and copy-by-default.
  tasks:
    - Keep 0.2.x source and candidate release verification fail-closed.
    - Qualify Linux release packages with retained artifact/runtime evidence.
    - Keep release documentation and reusable API/support claims aligned with evidence.
  changelog:
    - Keep CHANGELOG.md updated under Unreleased for every meaningful change.
