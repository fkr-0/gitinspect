<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- wasm-unsafe-eval is necessary for browser WebAssembly compilation; no arbitrary eval. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="theme-color" content="#070a0d" />
    <meta
      name="description"
      content="Experimental GitInspect browser edition bootstrapped through a Rust/WebAssembly runtime."
    />
    <title>GitInspect · WebAssembly experiment</title>
    <style>
      .wasm-boot {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 12vh 10vw;
        background: #070a0d;
        color: #dce7ee;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .wasm-boot h1 { max-width: 18ch; font-size: clamp(2rem, 5vw, 5rem); }
      .wasm-boot p { max-width: 70ch; color: #98a8b4; line-height: 1.6; }
      .wasm-boot--error h1 { color: #ffb6ad; }
      .wasm-runtime-badge {
        position: fixed;
        z-index: 10000;
        right: 12px;
        bottom: 12px;
        max-width: min(620px, calc(100vw - 24px));
        padding: 8px 11px;
        border: 1px solid rgba(156, 242, 203, 0.35);
        border-radius: 999px;
        background: rgba(7, 10, 13, 0.9);
        color: #9cf2cb;
        font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        pointer-events: none;
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/wasmMain.tsx"></script>
  </body>
</html>
