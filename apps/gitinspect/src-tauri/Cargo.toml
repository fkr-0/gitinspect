[package]
name = "gitinspect-app"
version = "0.3.0-rc.1"
description = "gitinspect desktop shell"
edition = "2024"
default-run = "gitinspect-app"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitinspect-core = { path = "../../../crates/gitinspect-core" }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Keep debug and test builds from accumulating large incremental compiler caches.
[profile.dev]
incremental = false

[profile.test]
incremental = false
