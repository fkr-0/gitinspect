[package]
name = "gitinspect-app"
version = "0.1.0"
description = "gitinspect desktop shell"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitinspect-core = { path = "../../../crates/gitinspect-core" }
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
