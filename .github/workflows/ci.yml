name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:metadata
      - run: pnpm release:metadata-test
      - run: pnpm release:package-audit-test
      - run: pnpm release:package-harness-test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Upload TypeScript coverage
        uses: actions/upload-artifact@v7
        with:
          name: typescript-coverage
          path: |
            apps/gitinspect/coverage
            packages/graph-elements/coverage
          if-no-files-found: error

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gitinspect-core -> target
      - name: Check gitinspect-core
        shell: bash
        run: |
          set -euo pipefail
          manifest=crates/gitinspect-core/Cargo.toml
          cargo fmt --manifest-path "$manifest" --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest"

  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/gitinspect/src-tauri -> target
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Qualify Tauri crate
        shell: bash
        run: |
          set -euo pipefail
          manifest=apps/gitinspect/src-tauri/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest"
          cargo check --manifest-path "$manifest" --all-targets
