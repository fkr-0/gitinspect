name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:metadata
      - run: pnpm release:metadata-test
      - run: pnpm lint
      - run: pnpm check

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check gitinspect-core when present
        shell: bash
        run: |
          set -euo pipefail
          manifest=crates/gitinspect-core/Cargo.toml
          if [[ ! -f "$manifest" ]]; then
            echo "gitinspect-core has not landed yet; skipping Rust core checks"
            exit 0
          fi
          cargo fmt --manifest-path "$manifest" --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest"

  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Qualify Tauri crate when present
        shell: bash
        run: |
          set -euo pipefail
          manifest=apps/gitinspect/src-tauri/Cargo.toml
          if [[ ! -f "$manifest" ]]; then
            echo "Tauri shell has not landed yet; skipping native app checks"
            exit 0
          fi
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          cargo test --manifest-path "$manifest"
          cargo check --manifest-path "$manifest" --all-targets
